name: qfza-backend

services:
  api:
    build: .
    # DATABASE_URL and REDIS_URL come from .env and must point at servers
    # reachable from inside the container (use host.docker.internal instead of
    # localhost when PostgreSQL/Redis run on the Docker host itself).
    env_file:
      - path: .env
        required: false
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
